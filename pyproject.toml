[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-abm"
version = "0.1.0"
description = "Mercado financiero artificial basado en agentes: análisis fundamental, técnico y sesgos de comportamiento"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mercado-abm = "mercado_abm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
